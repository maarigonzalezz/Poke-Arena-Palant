name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

# Los PR no reciben permisos de escritura ni secretos de la aplicación.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verificar flujo de ramas y contenido del PR
        run: node .github/scripts/check-pr.mjs
      - name: Verificar las propias políticas de integración
        run: node --test .github/scripts/*.test.mjs

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:cards
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POKEARENA_INTEGRATION_TESTS: '1'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '9.0.x'
      - name: Verificar PostgreSQL disponible para las pruebas
        run: docker pull postgres:17
      - run: dotnet restore backend/PokeArena.sln
      - run: dotnet build backend/PokeArena.sln --configuration Release --no-restore
      - name: Ejecutar pruebas con PostgreSQL real
        run: >-
          dotnet test backend/tests/PokeArena.Tests/PokeArena.Tests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=backend.trx" --results-directory TestResults
      - name: Conservar resultados para la revisión
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
