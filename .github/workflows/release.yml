name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar: v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exigir main y una versión SemVer estable
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Las entregas se publican únicamente desde main."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::La versión debe tener el formato vMAJOR.MINOR.PATCH."
            exit 1
          fi

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Crear etiqueta y Release del commit verificado
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node .github/scripts/create-release.mjs
